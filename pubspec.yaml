name: time_manager
description: "A new Flutter project."
publish_to: "none"
version: 1.186.0+2075

# 添加下面这段环境配置
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter 3.50 起 flutter/material.dart 已弃用，界面组件库改用官方迁移包。
  # 旧 material 的第三方面板（reorderables）靠 LegacyMaterialBridge 兼容。
  material_ui: ^1.11.0
  provider: ^6.1.1
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  logger: ^2.6.2
  shared_preferences: ^2.2.2
  flutter_slidable: ^4.0.3
  reorderables: ^0.6.0
  fl_chart: ^1.2.0 # 强大的图表库
  intl: ^0.20.2
  crypto: ^3.0.7
  http: ^1.6.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  geolocator: ^13.0.2
  geocoding: ^5.0.1
  path: ^1.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  home_widget: ^0.9.2
  file_picker: ^13.3.3
  package_info_plus: ^10.2.2
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.3
  # 写日记提醒（仅 Android）：定时通知 + 时区
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  # 农历 / 节气 / 节日换算（桌面出行单月日历），纯 Dart、零传递依赖。
  lunar: ^1.7.9

# 本地 fork：给写日记提醒的原生触发/通知提交/下次登记/开机恢复埋点写诊断事件。
# 上游 22.3.1 的完整包结构保留在 third_party/，改动见 third_party/flutter_local_notifications/FORK.md
dependency_overrides:
  flutter_local_notifications:
    path: third_party/flutter_local_notifications

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  google_sign_in_platform_interface: ^3.1.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    # 更新日志页直接读取这份文件，同时它也是发布脚本的 Release 说明来源。
    - docs/release-notes.md

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png" # 你设计好的图标路径
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"